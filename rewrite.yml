#
# OpenRewrite recipe definitions for the Java modernization sweep.
# See the "Code Modernization" section of README-DEV.md for how to run these.
# Recipes are grouped so each one lands as a single reviewable PR.
# =-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=

---
type: specs.openrewrite.org/v1beta/recipe
name: com.donohoedigital.Imports
displayName: Normalize imports
description: >
  Remove unused imports and normalize the rest to the project's IntelliJ code style.
  .idea/codeStyles sets no Java import options, so IntelliJ's defaults apply: collapse to
  a star import at 5 classes (3 for static).  Many files here carry "import javax.swing.*"
  while using only two or three classes from it, which is below that threshold - IntelliJ's
  own Optimize Imports would expand them too.
  Run this on its own.  OpenRewrite normalizes imports whenever any recipe removes one, so
  doing it once deliberately keeps every later recipe's diff free of import churn.
  RUN IT TWICE.  A same-package star import (e.g. "import com.donohoedigital.proto.tests.*"
  inside that same package) expands on the first pass into an explicit same-package import,
  which is still redundant, and only the second pass drops it.  Two files in proto/ hit this.
  Re-run until dryRun produces an empty patch.
recipeList:
  - org.openrewrite.java.RemoveUnusedImports

---
type: specs.openrewrite.org/v1beta/recipe
name: com.donohoedigital.TypeCleanup
displayName: Generics and type cleanup
description: >
  Diamond operator, redundant casts and C-style array declarations.
  The lowest-risk group - none of these change behaviour.
  NOTE: import handling lives in its own recipe - see Imports below.
  NOTE: org.openrewrite.staticanalysis.RemoveRedundantTypeCast is also NOT here - see
  the RedundantCasts recipe below.
  NOTE: org.openrewrite.staticanalysis.RemoveExtraSemicolons is also NOT here.  It
  swallows the whitespace following the semicolon, so "};\n\n    /**" collapses to
  "}/**" (seen in gui/DDButtonUI.java).  Only 7 sites in this code base - not worth
  hand-patching the recipe's output on every run.
recipeList:
  - org.openrewrite.staticanalysis.UseDiamondOperator
  - org.openrewrite.staticanalysis.UseJavaStyleArrayDeclarations
  - org.openrewrite.staticanalysis.UnnecessaryExplicitTypeArguments
  - org.openrewrite.staticanalysis.NoEmptyCollectionWithRawType

---
type: specs.openrewrite.org/v1beta/recipe
name: com.donohoedigital.Lambdas
displayName: Lambdas and method references
description: >
  Replace anonymous implementations of functional interfaces with lambdas.  Mostly Swing
  listeners and Runnables in poker/ and gameengine/.  Anonymous classes that hold state or
  refer to the enclosing instance via a bare "this" are left alone - "this" means the
  anonymous instance inside an anonymous class but the enclosing one inside a lambda.
  NOTE: ReplaceLambdaWithMethodReference is NOT here - see MethodReferences below.
recipeList:
  - org.openrewrite.staticanalysis.UseLambdaForFunctionalInterface
  - org.openrewrite.staticanalysis.LambdaBlockToExpression

---
type: specs.openrewrite.org/v1beta/recipe
name: com.donohoedigital.StringsAndCollections
displayName: String and collection API modernization
description: >
  isEmpty() over size() == 0, contains() over indexOf(), valueOf() over wrapper
  constructors, StringBuilder over StringBuffer, explicit charsets, and friends.
  NOT here, deliberately:
  - EqualsAvoidsNull.  It rewrites sName.equals("foo") as "foo".equals(sName), which is
    not behaviour preserving: a null receiver throws NPE today and would silently return
    false afterwards.  86 sites across 42 files.  Rejected - we do not want Yoda
    conditions in this code base, and an NPE on an unexpected null is worth seeing.
  - UseListSort.  It rewrites Collections.sort(list) as list.sort(null); correct, since
    null means natural ordering, but it reads worse than what it replaces.
recipeList:
  - org.openrewrite.staticanalysis.IsEmptyCallOnCollections
  - org.openrewrite.staticanalysis.IndexOfReplaceableByContains
  - org.openrewrite.staticanalysis.StringLiteralEquality
  - org.openrewrite.staticanalysis.NoValueOfOnStringType
  - org.openrewrite.staticanalysis.NoToStringOnStringType
  - org.openrewrite.staticanalysis.PrimitiveWrapperClassConstructorToValueOf
  - org.openrewrite.staticanalysis.UseStandardCharset
  - org.openrewrite.staticanalysis.ExplicitCharsetOnStringGetBytes
  - org.openrewrite.staticanalysis.UseStringReplace
  - org.openrewrite.staticanalysis.ChainStringBuilderAppendCalls
  - org.openrewrite.staticanalysis.ReplaceStringBufferWithStringBuilder

---
type: specs.openrewrite.org/v1beta/recipe
name: com.donohoedigital.FinalAndModifiers
displayName: Final fields and modifier hygiene
description: >
  Mark private fields final where they are assigned exactly once, drop redundant
  modifiers, order modifiers canonically.  Deliberately does NOT finalize locals or
  parameters (see FinalizeLocalVariables) - that is line noise, not information.
  MissingOverrideAnnotation is deliberately NOT used anywhere.  It would have added 2139
  annotations across 516 files, 268 of which change by nothing else, and IntelliJ does not
  flag missing @Override by default.  Rejected as unrequested churn.
  Hibernate entities are safe: FinalizePrivateFields only finalizes a field assigned
  exactly once, and entity fields are assigned in their setters.  No final was added to
  OnlineGame, TournamentHistory, OnlineProfile, Registration, BannedKey or UpgradedKey,
  and the Hibernate-backed tests (PokerDatabaseTest, OnlineGameTest, OnlineProfileTest,
  TournamentHistoryTest and the service tests) pass against a real database.
  AFTER RUNNING THIS, revert "final" on four fields.  FinalizePrivateFields counts
  assignments but does not check definite assignment or where the assignment lives:
    gameengine/.../GameListPanel.java      name_
        constructor returns early in the bDemo_ branch, so the field is not definitely
        assigned on every path -> "variable name_ might not have been initialized"
    poker/.../ShowTournamentTable.java     amount_, amountText_, slider_
        assigned in a regular method rather than a constructor
        -> "cannot assign a value to final variable"
  Both are compile errors, so a re-run can never slip past CI unnoticed - which is why
  the recipe is kept rather than dropped.
recipeList:
  - org.openrewrite.staticanalysis.FinalizePrivateFields
  - org.openrewrite.staticanalysis.FinalClass
  - org.openrewrite.staticanalysis.ModifierOrder
  - org.openrewrite.staticanalysis.StaticAccessViaInstance
  - org.openrewrite.staticanalysis.NestedEnumsAreNotStatic

---
type: specs.openrewrite.org/v1beta/recipe
name: com.donohoedigital.ParameterizedLogging
displayName: Parameterized logging
description: >
  Rewrite log.debug("x " + y) as log.debug("x {}", y) so the concatenation no longer
  happens when the level is disabled.
  ParameterizedLogging is not zero-config - it requires a methodPattern, and silently
  does nothing without one (it logs a validation error but still reports BUILD SUCCESS).
  This code base logs exclusively through log4j2 (org.apache.logging.log4j.Logger,
  239 imports), so one entry per level.

  THIS RECIPE CANNOT BE RUN BARE.  It throws IndexOutOfBoundsException from
  JavaTemplateParser on any call whose concatenation starts with a non-literal, e.g.
  logger.info(search + " GOODBYE") - the format string begins empty.  120 such calls in
  43 files, and one crash aborts the whole run.  Present in 3.32.0, the newest published
  version.  Exclude those files, computing the list rather than hardcoding it:

    cd "$DDHOME"
    EXCL=$(grep -rlE '\.(trace|debug|info|warn|error|fatal)\(\s*[^"; ][^;]{0,120}\+' \
             --include=*.java code | paste -sd, -)
    cd code && mvn rewrite:run \
      -Drewrite.activeRecipes=com.donohoedigital.ParameterizedLogging \
      -Drewrite.exclusions="$EXCL"

  Note exclusion paths are relative to the repo root and must keep the "code/" prefix.
  ALWAYS audit placeholder arity afterwards: a wrong {} count compiles, passes tests and
  silently produces a malformed log line.  A trailing Throwable is not a placeholder
  argument - log4j2 renders it as a stack trace - so {}=1 with 2 args is correct there.
recipeList:
  - org.openrewrite.java.logging.ParameterizedLogging:
      methodPattern: org.apache.logging.log4j.Logger trace(..)
  - org.openrewrite.java.logging.ParameterizedLogging:
      methodPattern: org.apache.logging.log4j.Logger debug(..)
  - org.openrewrite.java.logging.ParameterizedLogging:
      methodPattern: org.apache.logging.log4j.Logger info(..)
  - org.openrewrite.java.logging.ParameterizedLogging:
      methodPattern: org.apache.logging.log4j.Logger warn(..)
  - org.openrewrite.java.logging.ParameterizedLogging:
      methodPattern: org.apache.logging.log4j.Logger error(..)
  - org.openrewrite.java.logging.ParameterizedLogging:
      methodPattern: org.apache.logging.log4j.Logger fatal(..)

---
type: specs.openrewrite.org/v1beta/recipe
name: com.donohoedigital.DeadCode
displayName: Dead code removal
description: >
  RISKY - Hibernate, Wicket and the gameengine XML save-game code all reach members
  reflectively, and OpenRewrite cannot see those references.  Always dryRun and review
  each deletion against a grep of .java, .html and .xml before applying.
recipeList:
  - org.openrewrite.staticanalysis.RemoveUnusedPrivateFields
  - org.openrewrite.staticanalysis.RemoveUnusedPrivateMethods
  - org.openrewrite.staticanalysis.RemoveUnusedLocalVariables
  - org.openrewrite.staticanalysis.UnnecessaryThrows
  - org.openrewrite.staticanalysis.RemoveUnneededBlock
  - org.openrewrite.staticanalysis.CatchClauseOnlyRethrows
  - org.openrewrite.staticanalysis.UnnecessaryReturnAsLastStatement

---
type: specs.openrewrite.org/v1beta/recipe
name: com.donohoedigital.RedundantInitializers
displayName: Redundant field initializers
description: >
  Drop "= null", "= false", "= 0" from field declarations, where the JVM already
  guarantees that value.  Safe (fields only, never locals) but touches ~730 lines and
  IntelliJ does not flag it by default, so it is kept opt-in rather than folded into
  TypeCleanup.
recipeList:
  - org.openrewrite.staticanalysis.ExplicitInitialization

---
type: specs.openrewrite.org/v1beta/recipe
name: com.donohoedigital.RedundantCasts
displayName: Redundant type casts
description: >
  Drop casts left over from pre-generics code, e.g. (DDOption) options_.get(i) where
  options_ is already List<DDOption>.
  REVIEW EVERY CHANGE.  This recipe does not understand overload resolution: it removed
  the cast from init(sName, (String) null) in gui/DDImageButton.java, where it was
  disambiguating init(String,Icon) inherited from AbstractButton against the local
  init(String,String).  That one failed to compile, but a cast whose removal silently
  selects a different overload would not.  Kept opt-in for that reason.
recipeList:
  - org.openrewrite.staticanalysis.RemoveRedundantTypeCast

---
type: specs.openrewrite.org/v1beta/style
name: com.donohoedigital.ImportStyle
displayName: IntelliJ import layout
description: >
  Match IntelliJ's default import thresholds (5 classes, 3 static names) so OpenRewrite
  groups imports the way the IDE does.  .idea/codeStyles sets no Java import options, so
  those defaults are what this project uses.  Wired in via <activeStyles> in code/pom.xml,
  so every recipe run picks it up.
styleConfigs:
  - org.openrewrite.java.style.ImportLayoutStyle:
      classCountToUseStarImport: 5
      nameCountToUseStarImport: 3
      layout:
        - import java.*
        - <blank line>
        - import javax.*
        - <blank line>
        - import all other imports
        - <blank line>
        - import static all other imports

---
type: specs.openrewrite.org/v1beta/recipe
name: com.donohoedigital.MethodReferences
displayName: Method references
description: >
  Replace lambdas that merely delegate with method references, e.g. () -> updateAll()
  becomes this::updateAll.
  REVIEW EVERY CHANGE.  This recipe confuses a superclass with an enclosing class.  In
  gameengine/SendMessageDialog.java, which extends DialogPhase, it emitted
  "DialogPhase.this::removeDialog" - illegal, because DialogPhase is a supertype rather
  than an enclosing instance, and the gameengine module stopped compiling.  Kept opt-in
  for that reason.
recipeList:
  - org.openrewrite.staticanalysis.ReplaceLambdaWithMethodReference
